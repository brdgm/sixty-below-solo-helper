name: Build

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: brdgm/github-action-build@v1
        with:
          # SonarQube Cloud Automatic Analysis is enabled, so skip CI analysis.
          github-token: ${{ secrets.GITHUB_TOKEN }}
